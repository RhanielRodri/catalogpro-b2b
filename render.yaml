services:
  - type: web
    name: catalogpro-b2b-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build && npm run prisma:deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://catalogpro-b2b.vercel.app
